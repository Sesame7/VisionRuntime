<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VisionRuntime</title>
<style>
body { margin:0; padding:0; font-family:Arial, sans-serif; background:#111; color:#eee; }
:root { --ok:#6ccf85; --ng:#f05a5a; --err:#ffb020; --panel:#1d1d1d; --panel-strong:#222; --panel-border:#333; --muted:#888; --recipe-control-width:120px; --line:#333; --control-border:#444; --radius:6px; --menu-shadow:0 6px 18px rgba(0,0,0,0.45); }
.header { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 8px; font-size:26px; font-weight:600; letter-spacing:0.5px; }
.title-left { display:flex; align-items:center; gap:10px; }
.logo { height:50px; width:auto; }
.layout { display:flex; flex-direction:row; height:100vh; }
.left { flex:1; display:flex; align-items:center; justify-content:center; padding:8px; }
.left img { max-width:100%; max-height:100%; object-fit:contain; background:#000; }
.right { width:400px; padding:8px; display:flex; flex-direction:column; gap:8px; }
.panel { background:var(--panel); border:1px solid var(--panel-border); border-radius:8px; padding:8px; }
  .btn { display:inline-block; padding:10px 16px; min-width:110px; margin-right:6px; background:#2d7efc; color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:14px; }
  .btn-row { display:flex; gap:12px; align-items:center; justify-content:space-between; }
  .head-meta { display:flex; flex-direction:column; gap:6px; }
.table-wrap { flex:1; overflow:auto; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th, td { padding:6px 8px; text-align:left; border-bottom:1px solid var(--line); }
th { position:sticky; top:0; background:var(--panel-strong); }
.ok { color:var(--ok); }
.ng { color:var(--ng); }
.err { color:var(--err); }
.stats { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
.stat { padding:8px; background:var(--panel-strong); border-radius:var(--radius); text-align:center; }
.stat .label { font-size:11px; color:var(--muted); }
.stat .value { font-size:16px; font-weight:600; margin-top:4px; }
.online { display:flex; align-items:center; gap:10px; padding:10px; background:var(--panel); border-radius:var(--radius); font-size:14px; }
.online .dot { width:12px; height:12px; border-radius:50%; background:#555; }
.online.ok .dot { background:var(--ok); box-shadow:0 0 6px rgba(108,207,133,0.6); }
.online.ng .dot { background:var(--ng); box-shadow:0 0 6px rgba(240,90,90,0.6); }
.footer-row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.footer-row .online { flex:1; min-width:0; }
.batch-bar { display:flex; align-items:center; gap:8px; }
.batch-current { flex:1; min-width:0; font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; user-select:none; }
.batch-input { width:140px; height:34px; border:1px solid var(--control-border); border-radius:var(--radius); background:var(--panel-strong); color:#eee; padding:0 10px; font-size:13px; }
.batch-input::placeholder { color:#888; }
.batch-set-btn { min-width:60px; height:34px; margin-right:0; padding:0 10px; font-size:13px; }
.batch-msg { margin-top:6px; min-height:16px; font-size:12px; color:var(--muted); }
.batch-msg.err { color:var(--ng); }
.batch-msg.success { color:var(--ok); }
.recipe-wrap { display:flex; align-items:center; gap:6px; min-width:0; }
.recipe-label { font-size:12px; color:var(--muted); white-space:nowrap; user-select:none; }
.recipe-control { position:relative; min-width:0; }
.recipe-toggle { width:var(--recipe-control-width); height:34px; background:var(--panel-strong); color:#eee; border:1px solid var(--control-border); border-radius:var(--radius); padding:4px 10px; font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px; }
.recipe-toggle:disabled { opacity:0.7; cursor:default; }
.recipe-toggle::after { content:'\25BE'; font-size:11px; color:#aaa; }
.recipe-menu { position:absolute; right:0; bottom:calc(100% + 6px); width:var(--recipe-control-width); max-height:220px; overflow:auto; background:var(--panel-strong); border:1px solid var(--control-border); border-radius:var(--radius); box-shadow:var(--menu-shadow); padding:4px; z-index:10; }
.recipe-menu[hidden] { display:none; }
.recipe-item { width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px; background:transparent; color:#eee; border:none; border-radius:4px; padding:7px 8px; cursor:pointer; text-align:left; font-size:13px; }
.recipe-item:hover { background:#2a2a2a; }
.recipe-item.current { color:var(--ok); }
.recipe-item.invalid { color:#999; }
.recipe-item:disabled { opacity:0.65; cursor:not-allowed; }
.recipe-item .badge { font-size:11px; color:#aaa; }
.title-time { margin-left:0; color:#eee; }
.status-time { font-size:15px; margin-left:13px; }
</style>
</head>
<body>
<div class="layout">
  <div class="left">
    <img id="img" src="/preview/latest" alt="latest image"/>
  </div>
  <div class="right">
    <div class="panel">
      <div class="header" id="titleHeader">
        <div class="title-left">
          <svg class="logo" viewBox="53 27 194 247" role="img" aria-label="Toplink Vision logo" fill="currentColor">
            <path d="M 138.050 266.400 L 137.700 248.039 L 110.500 247.923 L 109.077 246.500 L 109.050 186.500 L 115.500 162.977 L 130.600 167.950 L 145.500 169.923 L 146.886 168.700 L 147.023 146.400 L 123.500 140.923 L 105.218 128.700 L 91.077 107.500 L 87.500 84.950 L 63.050 85.500 L 65.077 106.500 L 69.077 118.500 L 76.050 130.500 L 66.077 152.400 L 60.050 178.500 L 59.050 265.400 L 63.500 267.923 L 136.500 267.950 L 138.050 266.400 Z" />
            <path d="M 161.950 266.400 L 162.300 248.039 L 189.500 247.923 L 190.923 246.500 L 190.950 186.500 L 184.500 162.977 L 169.400 167.950 L 154.500 169.923 L 153.114 168.700 L 152.977 146.400 L 176.500 140.923 L 194.782 128.700 L 208.923 107.500 L 212.500 84.950 L 236.950 85.500 L 234.923 106.500 L 230.923 118.500 L 223.950 130.500 L 233.923 152.400 L 239.950 178.500 L 240.950 265.400 L 236.500 267.923 L 163.500 267.950 L 161.950 266.400 Z" />
            <path d="M 198.000 81.500 A 48.500 48.500 0 1 0 101.000 81.500 A 48.500 48.500 0 1 0 198.000 81.500 Z M 186.000 81.500 A 36.500 36.500 0 1 0 113.000 81.500 A 36.500 36.500 0 1 0 186.000 81.500 Z M 179.000 81.500 A 29.500 29.500 0 1 0 120.000 81.500 A 29.500 29.500 0 1 0 179.000 81.500 Z M 146.697 67.449 A 5.310 5.310 0 1 0 136.077 67.449 A 5.310 5.310 0 1 0 146.697 67.449 Z M 189.378 62.905 A 44.000 44.000 0 0 1 190.846 96.549 L 188.027 95.523 A 41.000 41.000 0 0 0 186.659 64.173 Z" fill-rule="evenodd" />
          </svg>
          Toplink Vision
        </div>
        <span class="title-time" id="clockTime">--</span>
      </div>
      <div class="head-meta">
        <div class="btn-row">
          <div id="statusTime" class="status-time">--</div>
          <button id="triggerBtn" class="btn">Trigger</button>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="stats">
        <div class="stat"><div class="label">Total</div><div class="value" id="statTotal">0</div></div>
        <div class="stat"><div class="label">OK</div><div class="value ok" id="statOk">0</div></div>
        <div class="stat"><div class="label">NG</div><div class="value ng" id="statNg">0</div></div>
        <div class="stat"><div class="label">Error</div><div class="value err" id="statErr">0</div></div>
        <div class="stat"><div class="label">Pass%</div><div class="value" id="statPass">0%</div></div>
      </div>
    </div>
    <div class="panel table-wrap">
      <table id="records">
        <thead><tr><th>ID</th><th>Result</th><th>Date</th><th>Time</th><th>ms</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="panel" id="batchPanel" hidden>
      <div class="batch-bar">
        <span class="batch-current" id="batchCurrent">=@NO-BATCH_+</span>
        <input id="batchInput" class="batch-input" type="text" maxlength="32" placeholder="New batch">
        <button id="batchSetBtn" class="btn batch-set-btn" type="button">Set</button>
      </div>
      <div id="batchMsg" class="batch-msg" hidden></div>
    </div>
    <div class="panel">
      <div class="footer-row">
        <div class="online" id="onlineBox">
          <span class="dot"></span>
          <span id="onlineText">Runtime: Connecting...</span>
        </div>
        <div class="recipe-wrap">
          <span class="recipe-label">Recipe</span>
          <div class="recipe-control">
            <button id="recipeToggle" class="recipe-toggle" type="button" disabled aria-haspopup="listbox" aria-expanded="false">Loading...</button>
            <div id="recipeMenu" class="recipe-menu" role="listbox" hidden></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
const REFRESH_MS = 1000;
const HEARTBEAT_STALE_POLLS = 3;
const ID_PAD_LEN = 5;
const STATUS_TIMEOUT_MS = 1200;
const TRIGGER_TIMEOUT_MS = 1500;
const RECIPE_SWITCH_TIMEOUT_MS = 12000;
const BATCH_SWITCH_TIMEOUT_MS = 3000;

const els = {
  img: document.getElementById('img'),
  titleHeader: document.getElementById('titleHeader'),
  clockTime: document.getElementById('clockTime'),
  statusTime: document.getElementById('statusTime'),
  onlineBox: document.getElementById('onlineBox'),
  onlineText: document.getElementById('onlineText'),
  triggerBtn: document.getElementById('triggerBtn'),
  batchPanel: document.getElementById('batchPanel'),
  batchCurrent: document.getElementById('batchCurrent'),
  batchInput: document.getElementById('batchInput'),
  batchSetBtn: document.getElementById('batchSetBtn'),
  batchMsg: document.getElementById('batchMsg'),
  recipeWrap: document.querySelector('.recipe-wrap'),
  recipeToggle: document.getElementById('recipeToggle'),
  recipeMenu: document.getElementById('recipeMenu'),
  statTotal: document.getElementById('statTotal'),
  statOk: document.getElementById('statOk'),
  statNg: document.getElementById('statNg'),
  statErr: document.getElementById('statErr'),
  statPass: document.getElementById('statPass'),
  tbody: document.querySelector('#records tbody'),
};

let refreshInFlight = false;
let cachedRecords = [];
let lastSeenSeq = null;
let recipeSwitchInFlight = false;
let recipeMenuOpen = false;
let batchSwitchInFlight = false;

async function fetchWithTimeout(url, options, timeoutMs){
  const ctrl = new AbortController();
  const timer = setTimeout(function(){ ctrl.abort(); }, timeoutMs);
  try{
    return await fetch(url, {...(options || {}), signal: ctrl.signal});
  } finally {
    clearTimeout(timer);
  }
}

async function doTrigger(){
  try{
    const r = await fetchWithTimeout('/trigger', {method:'POST'}, TRIGGER_TIMEOUT_MS);
    if (!r.ok){
      throw new Error(`trigger_http_${r.status}`);
    }
    try { await r.json(); } catch(_e) {}
  } catch(e){
    console.error(e);
  }
}

async function switchRecipe(slot){
  const slotVal = Number(slot);
  if (!Number.isInteger(slotVal) || slotVal <= 0 || recipeSwitchInFlight) return;
  recipeSwitchInFlight = true;
  let switched = false;
  closeRecipeMenu();
  els.recipeToggle.disabled = true;
  try{
    const r = await fetchWithTimeout(
      '/recipe/select',
      {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({slot: slotVal}),
      },
      RECIPE_SWITCH_TIMEOUT_MS,
    );
    let payload = {};
    try { payload = await r.json(); } catch(_e) {}
    if (!r.ok || !payload.ok){
      const msg = payload.message || `recipe_http_${r.status}`;
      throw new Error(msg);
    }
    switched = true;
  } catch(e){
    console.error(e);
  } finally {
    if (switched){
      cachedRecords = [];
      lastSeenSeq = null;
      lastImgId = null;
    }
    recipeSwitchInFlight = false;
    await refresh();
  }
}

function closeRecipeMenu(){
  recipeMenuOpen = false;
  els.recipeMenu.hidden = true;
  els.recipeToggle.setAttribute('aria-expanded', 'false');
}

function openRecipeMenu(){
  if (els.recipeToggle.disabled) return;
  recipeMenuOpen = true;
  els.recipeMenu.hidden = false;
  els.recipeToggle.setAttribute('aria-expanded', 'true');
}

function toggleRecipeMenu(){
  if (recipeMenuOpen){
    closeRecipeMenu();
  } else {
    openRecipeMenu();
  }
}

function renderBatch(batchState){
  if (!batchState || typeof batchState !== 'object'){
    els.batchPanel.hidden = true;
    els.batchMsg.hidden = true;
    return;
  }
  els.batchPanel.hidden = false;
  const current = String(batchState.current || '');
  els.batchCurrent.innerText = current || '=@NO-BATCH_+';
  const hasInput = String(els.batchInput.value || '').trim().length > 0;
  els.batchSetBtn.disabled = batchSwitchInFlight || !hasInput;
}

function showBatchMessage(message, isError){
  const text = String(message || '').trim();
  if (!text){
    els.batchMsg.hidden = true;
    els.batchMsg.innerText = '';
    els.batchMsg.className = 'batch-msg';
    return;
  }
  els.batchMsg.hidden = false;
  els.batchMsg.className = isError ? 'batch-msg err' : 'batch-msg success';
  els.batchMsg.innerText = text;
}

async function setBatch(){
  const name = String(els.batchInput.value || '').trim();
  if (!name || batchSwitchInFlight){
    return;
  }
  batchSwitchInFlight = true;
  els.batchSetBtn.disabled = true;
  showBatchMessage('', false);
  try{
    const r = await fetchWithTimeout(
      '/batch/select',
      {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({name: name}),
      },
      BATCH_SWITCH_TIMEOUT_MS,
    );
    let payload = {};
    try { payload = await r.json(); } catch(_e) {}
    if (!r.ok || !payload.ok){
      const msg = payload.message || `batch_http_${r.status}`;
      throw new Error(msg);
    }
    els.batchInput.value = '';
    showBatchMessage(payload.message || 'batch set', false);
  } catch(e){
    console.error(e);
    showBatchMessage((e && e.message) ? e.message : 'batch set failed', true);
  } finally {
    batchSwitchInFlight = false;
    await refresh();
  }
}

function normalizeRecipeSlots(rawSlots){
  return (Array.isArray(rawSlots) ? rawSlots : []).map(function(item){
    return {
      slot: Number((item || {}).slot || 0),
      name: String((item || {}).name || ''),
      valid: Boolean((item || {}).valid),
      error: String((item || {}).error || ''),
    };
  }).filter(function(item){
    return Number.isInteger(item.slot) && item.slot > 0 && Boolean(item.name);
  });
}

function buildRecipeItem(item, currentSlot, switching){
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'recipe-item';
  if (item.slot === currentSlot){
    btn.classList.add('current');
  }
  if (!item.valid){
    btn.classList.add('invalid');
  }
  btn.disabled = switching || !item.valid;
  if (item.error){
    btn.title = item.error;
  }

  const nameEl = document.createElement('span');
  nameEl.innerText = item.name;
  btn.appendChild(nameEl);

  if (item.slot === currentSlot){
    const badge = document.createElement('span');
    badge.className = 'badge';
    badge.innerText = 'Current';
    btn.appendChild(badge);
  } else if (!item.valid){
    const badge = document.createElement('span');
    badge.className = 'badge';
    badge.innerText = 'Invalid';
    btn.appendChild(badge);
  }

  btn.addEventListener('click', function(ev){
    ev.stopPropagation();
    closeRecipeMenu();
    void switchRecipe(item.slot);
  });
  return btn;
}

function renderRecipes(recipeState){
  const state = recipeState || {};
  const slots = normalizeRecipeSlots(state.slots);
  const currentSlot = Number(state.current_slot || 0);
  const switching = Boolean(state.switching) || recipeSwitchInFlight;
  const totalSlots = Number(state.total_slots || 0);
  const menu = els.recipeMenu;
  const toggle = els.recipeToggle;

  menu.innerHTML = '';
  if (!slots.length || totalSlots <= 0){
    toggle.innerText = 'N/A';
    toggle.disabled = true;
    closeRecipeMenu();
    return;
  }

  slots.forEach(function(item){
    menu.appendChild(buildRecipeItem(item, currentSlot, switching));
  });

  const current = slots.find(function(item){ return item.slot === currentSlot; });
  if (current){
    toggle.innerText = current.name;
  } else {
    toggle.innerText = '--';
  }
  toggle.disabled = switching;
  if (switching){
    closeRecipeMenu();
  }
}
let lastImgId = null;
let lastHeartbeatSeq = null;
let hasHeartbeatProgress = false;
let staleHeartbeatPolls = HEARTBEAT_STALE_POLLS;
const baseStats = {total:0,ok:0,ng:0,error:0,pass_rate:0};
function resultClass(result){
  const r = String(result || '').toUpperCase();
  return (r === 'OK') ? 'ok' : ((r === 'NG') ? 'ng' : 'err');
}
function renderStats(stats){
  const s = stats || baseStats;
  els.statTotal.innerText = s.total;
  els.statOk.innerText = s.ok;
  els.statNg.innerText = s.ng;
  els.statErr.innerText = s.error || 0;
  els.statPass.innerText = (s.pass_rate * 100).toFixed(1);
}

function toIsoDate(ms){
  if (!Number.isFinite(ms)) return '';
  return new Date(ms).toISOString().slice(0, 10);
}

function toIsoTime(ms){
  if (!Number.isFinite(ms)) return '';
  return new Date(ms).toISOString().slice(11, 24);
}

function renderRecords(records, maxRecords){
  const limit = (typeof maxRecords === 'number' && maxRecords > 0) ? maxRecords : records.length;
  const showRecs = records.slice(0, limit);
  els.tbody.innerHTML = '';
  showRecs.forEach(function(rec){
    const id = rec.trigger_seq || 0;
    const duration = typeof rec.duration_ms==='number' ? rec.duration_ms : 0;
    const triggeredAtMs = Number(rec.triggered_at_ms);
    const cls = resultClass(rec.result);
    const tr=document.createElement('tr');
    tr.innerHTML = `<td>${String(id).padStart(ID_PAD_LEN,'0')}</td>
                    <td class="${cls}">${rec.result}</td>
                    <td>${toIsoDate(triggeredAtMs)}</td>
                    <td>${toIsoTime(triggeredAtMs)}</td>
                    <td>${duration.toFixed(1)}</td>`;
    els.tbody.appendChild(tr);
  });
  return showRecs;
}
function renderOnline(state){
  if (state === 'ok'){
    els.onlineBox.className = 'online ok';
    els.onlineText.innerText = 'Runtime: Online';
    return;
  }
  if (state === 'pending'){
    els.onlineBox.className = 'online';
    els.onlineText.innerText = 'Runtime: Connecting...';
    return;
  }
  els.onlineBox.className = 'online ng';
  els.onlineText.innerText = 'Runtime: Offline';
}

function staleOnlineState(){
  return hasHeartbeatProgress && staleHeartbeatPolls < HEARTBEAT_STALE_POLLS
    ? 'ok'
    : 'ng';
}

function updateHeartbeatOnline(heartbeatSeq){
  const hasSeq = typeof heartbeatSeq === 'number' && Number.isFinite(heartbeatSeq);
  if (!hasSeq){
    staleHeartbeatPolls += 1;
    renderOnline(staleOnlineState());
    return;
  }
  if (lastHeartbeatSeq === null){
    lastHeartbeatSeq = heartbeatSeq;
    staleHeartbeatPolls = 0;
    renderOnline('pending');
    return;
  }
  if (heartbeatSeq > lastHeartbeatSeq){
    lastHeartbeatSeq = heartbeatSeq;
    hasHeartbeatProgress = true;
    staleHeartbeatPolls = 0;
    renderOnline('ok');
    return;
  }
  if (heartbeatSeq < lastHeartbeatSeq){
    lastHeartbeatSeq = heartbeatSeq;
    hasHeartbeatProgress = false;
    staleHeartbeatPolls = 0;
    renderOnline('pending');
    return;
  }
  staleHeartbeatPolls += 1;
  renderOnline(staleOnlineState());
}
function tickClock(){
  els.clockTime.innerText = new Date().toLocaleTimeString([], { hour12: false });
}

function mergeStatusRecords(records, maxRecords, fullSnapshot){
  if (fullSnapshot || lastSeenSeq === null){
    cachedRecords = records.slice(0, maxRecords > 0 ? maxRecords : records.length);
    return;
  }
  if (!records.length){
    return;
  }
  const seen = new Set(cachedRecords.map(function(rec){ return rec.trigger_seq; }));
  for (let i = records.length - 1; i >= 0; i -= 1){
    const rec = records[i];
    const key = rec.trigger_seq;
    if (!seen.has(key)){
      cachedRecords.unshift(rec);
      seen.add(key);
    }
  }
  if (maxRecords > 0 && cachedRecords.length > maxRecords){
    cachedRecords = cachedRecords.slice(0, maxRecords);
  }
}

function updateLatestSeq(latestSeq){
  if (typeof latestSeq === 'number' && Number.isFinite(latestSeq)){
    lastSeenSeq = latestSeq;
    return;
  }
  if (cachedRecords.length){
    lastSeenSeq = Number(cachedRecords[0].trigger_seq || 0);
  }
}

function renderLatestRecordHeader(showRecs){
  if (!showRecs.length){
    return;
  }
  const r0 = showRecs[0];
  const id0 = r0.trigger_seq || 0;
  const triggeredAtMs = Number(r0.triggered_at_ms);
  const date0 = toIsoDate(triggeredAtMs);
  const time0 = toIsoTime(triggeredAtMs);
  const cls0 = resultClass(r0.result);
  els.statusTime.className = `status-time ${cls0}`;
  els.statusTime.innerText = `${String(id0).padStart(ID_PAD_LEN,'_')} ${date0} ${time0}`;
  els.titleHeader.className = `header ${cls0}`;
  if (id0 !== lastImgId){
    lastImgId = id0;
    els.img.src='/preview/latest?ts='+Date.now();
  }
}

function applyStatusPayload(payload){
  els.statusTime.innerText = 'Idle';
  els.statusTime.className = 'status-time';

  const records = Array.isArray(payload.records) ? payload.records : [];
  const maxRecords = Number(payload.max_records || 0);
  const fullSnapshot = Boolean(payload.full_snapshot);
  mergeStatusRecords(records, maxRecords, fullSnapshot);
  updateLatestSeq(payload.latest_seq);

  renderStats(payload.stats);
  const showRecs = renderRecords(cachedRecords, maxRecords);
  renderLatestRecordHeader(showRecs);
  updateHeartbeatOnline(payload.heartbeat_seq);
  renderRecipes(payload.recipe);
  renderBatch(payload.batch);
}

async function refresh(){
  if (refreshInFlight) return;
  refreshInFlight = true;
  try{
    const statusUrl = (lastSeenSeq === null)
      ? '/status'
      : `/status?since_seq=${encodeURIComponent(String(lastSeenSeq))}`;
    const r = await fetchWithTimeout(statusUrl, {}, STATUS_TIMEOUT_MS);
    if (!r.ok){
      throw new Error(`status_http_${r.status}`);
    }
    applyStatusPayload(await r.json());
  }catch(e){
    console.error(e);
    els.statusTime.innerText = 'Status unreachable';
    els.statusTime.className = 'status-time';
    staleHeartbeatPolls += 1;
    renderOnline(staleOnlineState());
    renderRecipes(null);
    renderBatch(null);
  } finally {
    refreshInFlight = false;
  }
}
els.triggerBtn.addEventListener('click', function(){
  void doTrigger();
});
els.recipeToggle.addEventListener('click', function(ev){
  ev.stopPropagation();
  toggleRecipeMenu();
});
els.batchInput.addEventListener('input', function(){
  showBatchMessage('', false);
  renderBatch({current: els.batchCurrent.innerText});
});
els.batchInput.addEventListener('keydown', function(ev){
  if (ev.key === 'Enter'){
    ev.preventDefault();
    void setBatch();
  }
});
els.batchSetBtn.addEventListener('click', function(){
  void setBatch();
});
document.addEventListener('click', function(ev){
  if (!els.recipeWrap.contains(ev.target)){
    closeRecipeMenu();
  }
});
document.addEventListener('keydown', function(ev){
  if (ev.key === 'Escape'){
    closeRecipeMenu();
  }
});
window.addEventListener('blur', closeRecipeMenu);
setInterval(tickClock, REFRESH_MS);
setInterval(refresh, REFRESH_MS);
window.addEventListener('focus', function(){ void refresh(); });
tickClock();
void refresh();
</script>
</body>
</html>
